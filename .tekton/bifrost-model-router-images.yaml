apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: bifrost-model-router-images-
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/max-keep-runs: "10"
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/target-namespace: "tekton-buildkit"
    ci/trigger: "main"
  labels:
    app.kubernetes.io/part-of: ci
    tekton.dev/pipeline: bifrost-model-router-images
    ci/repo: "{{ repo_name }}"
spec:
  taskRunTemplate:
    serviceAccountName: tekton-build-sa
    podTemplate:
      nodeSelector:
        storage.xlab.now/fast-local: "true"
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
  taskRunSpecs:
    - pipelineTaskName: verify
      stepSpecs:
        - name: run
          computeResources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "8"
              memory: 12Gi
    - pipelineTaskName: publish-ghcr
      podTemplate:
        hostUsers: false
      stepSpecs:
        - name: run
          computeResources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "8"
              memory: 12Gi
    - pipelineTaskName: publish-cache
      serviceAccountName: nix-cache-publisher
  timeouts:
    pipeline: 180m0s
  params:
    - name: repo_url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
    - name: git_auth_secret
      value: "{{ git_auth_secret }}"
  pipelineSpec:
    params:
      - name: repo_url
        type: string
      - name: revision
        type: string
      - name: git_auth_secret
        type: string
    workspaces:
      - name: source
      - name: nix-store
      - name: basic-auth
      - name: docker-config
      - name: github-packages-auth
    tasks:
      - name: clone
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: git-clone
            - name: namespace
              value: tekton-pipelines
        timeout: 10m
        workspaces:
          - name: output
            workspace: source
          - name: basic-auth
            workspace: basic-auth
        params:
          - name: url
            value: "$(params.repo_url)"
          - name: revision
            value: "$(params.revision)"
          - name: depth
            value: "1"
          - name: submodules
            value: "false"

      - name: verify
        runAfter: ["clone"]
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: nix-run
            - name: namespace
              value: tekton-pipelines
        timeout: 75m
        workspaces:
          - name: source
            workspace: source
          - name: nix-store
            workspace: nix-store
        params:
          - name: SCRIPT
            value: |
              nix flake check --print-build-logs --max-jobs 2 --cores 4

      - name: build-and-push-image
        runAfter: ["verify"]
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: nix-build-push
            - name: namespace
              value: tekton-pipelines
        timeout: 60m
        workspaces:
          - name: source
            workspace: source
          - name: nix-store
            workspace: nix-store
          - name: docker-config
            workspace: docker-config
        params:
          - name: SERVICES
            value: |
              bifrost-model-router:.:.#bifrost-model-router-image
          - name: REGISTRY_PREFIX
            value: "registry.registry.svc.cluster.local"
          - name: COMMIT_SHA
            value: "$(tasks.clone.results.COMMIT_SHA)"
          - name: EXTRA_TAGS
            value: "main"
          - name: TLS_VERIFY
            value: "false"

      - name: publish-ghcr
        runAfter: ["build-and-push-image"]
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: nix-run-github-v2
            - name: namespace
              value: tekton-buildkit
        timeout: 35m
        workspaces:
          - name: source
            workspace: source
          - name: nix-store
            workspace: nix-store
          - name: github-packages-auth
            workspace: github-packages-auth
        params:
          - name: GITHUB_TOKEN_SECRET_NAME
            value: $(params.git_auth_secret)
          - name: SCRIPT
            value: >-
              nix run .#publish-container --
              "ghcr.io/applyinnovations/bifrost-model-router:sha-$(tasks.clone.results.COMMIT_SHA)"
              "ghcr.io/applyinnovations/bifrost-model-router:main"

    # Push and scheduled runs publish this run's store to the shared Nix cache.
    finally:
      - name: publish-cache
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: nix-cache-publish
            - name: namespace
              value: tekton-pipelines
        workspaces:
          - name: nix-store
            workspace: nix-store
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          storageClassName: fast-local
          resources:
            requests:
              storage: 20Gi
    # A private Nix store for this run, shared by its tasks and deleted with the
    # PipelineRun; tools come from the shared Nix cache.
    - name: nix-store
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: fast-local
          resources:
            requests:
              storage: 40Gi
    - name: basic-auth
      secret:
        secretName: "{{ git_auth_secret }}"
    - name: docker-config
      secret:
        secretName: registry-credentials
    - name: github-packages-auth
      secret:
        secretName: github-packages-credentials
