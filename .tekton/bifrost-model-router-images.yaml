# Pushes to main: every flake check and the image build in one sandboxed Nix
# pod with no credentials, then credential-only publish Tasks push the OCI
# archive to the internal registry (Flux deploys `main`) and to GHCR.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: bifrost-model-router-images-
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/max-keep-runs: "10"
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/target-namespace: "tekton-buildkit"
    ci/trigger: "main"
  labels:
    app.kubernetes.io/part-of: ci
    tekton.dev/pipeline: bifrost-model-router-images
    ci/repo: "{{ repo_name }}"
spec:
  taskRunTemplate:
    serviceAccountName: default
    podTemplate:
      automountServiceAccountToken: false
      nodeSelector:
        storage.xlab.now/fast-local: "true"
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
  taskRunSpecs:
    - pipelineTaskName: build
      podTemplate:
        hostUsers: false
      stepSpecs:
        - name: run
          computeResources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "8"
              memory: 12Gi
    - pipelineTaskName: publish-cache
      serviceAccountName: nix-cache-publisher
  timeouts:
    pipeline: 180m0s
  params:
    - name: repo_url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
  pipelineSpec:
    params:
      - name: repo_url
        type: string
      - name: revision
        type: string
    workspaces:
      - name: source
      - name: basic-auth
      - name: artifacts
      - name: nix-cache-export
      - name: docker-config
      - name: ghcr-docker-config
    tasks:
      - name: clone
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: git-clone-v1
            - name: namespace
              value: tekton-pipelines
        timeout: 10m
        workspaces:
          - name: output
            workspace: source
          - name: basic-auth
            workspace: basic-auth
        params:
          - name: url
            value: "$(params.repo_url)"
          - name: revision
            value: "$(params.revision)"
          - name: expectedCommitSha
            value: "$(params.revision)"

      # The image is one of the flake checks, so building it after them in the
      # same pod reuses this pod's store instead of substituting it again.
      - name: build
        runAfter: ["clone"]
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: nix-v1
            - name: namespace
              value: tekton-buildkit
        timeout: 75m
        workspaces:
          - name: source
            workspace: source
          - name: artifacts
            workspace: artifacts
          - name: nix-cache-export
            workspace: nix-cache-export
        params:
          - name: SCRIPT
            value: |
              nix flake check --no-update-lock-file --print-build-logs --max-jobs 2 --cores 4
          - name: IMAGE
            value: ".#bifrost-model-router-image"

      # `main` goes last: Flux follows it, after the immutable tags exist.
      - name: publish-internal
        runAfter: ["build"]
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: oci-publish-v1
            - name: namespace
              value: tekton-pipelines
        timeout: 20m
        workspaces:
          - name: artifacts
            workspace: artifacts
          - name: docker-config
            workspace: docker-config
        params:
          - name: IMAGE
            value: registry.xlab.now/bifrost-model-router
          - name: COMMIT_SHA
            value: "$(tasks.clone.results.COMMIT_SHA)"
          - name: ARCHIVE_SHA256
            value: "$(tasks.build.results.ARCHIVE_SHA256)"
          - name: EXTRA_TAGS
            value: |
              $(tasks.build.results.NIX_TAG)
              latest
              main

      - name: publish-ghcr
        runAfter: ["build"]
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: oci-publish-v1
            - name: namespace
              value: tekton-pipelines
        timeout: 35m
        workspaces:
          - name: artifacts
            workspace: artifacts
          - name: docker-config
            workspace: ghcr-docker-config
        params:
          - name: IMAGE
            value: ghcr.io/applyinnovations/bifrost-model-router
          - name: COMMIT_SHA
            value: "$(tasks.clone.results.COMMIT_SHA)"
          - name: ARCHIVE_SHA256
            value: "$(tasks.build.results.ARCHIVE_SHA256)"
          - name: EXTRA_TAGS
            value: |
              sha-$(tasks.clone.results.COMMIT_SHA)
              main

    # Push runs publish the store paths the build added to the shared Nix cache.
    finally:
      - name: publish-cache
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: nix-cache-publish-v1
            - name: namespace
              value: tekton-pipelines
        workspaces:
          - name: nix-cache-export
            workspace: nix-cache-export
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          storageClassName: fast-local
          resources:
            requests:
              storage: 4Gi
    - name: basic-auth
      secret:
        secretName: "{{ git_auth_secret }}"
    # The OCI archive handed from the build to the publish Tasks.
    - name: artifacts
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          storageClassName: fast-local
          resources:
            requests:
              storage: 4Gi
    # The store paths the build added, as a file:// cache for publish-cache.
    - name: nix-cache-export
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          storageClassName: fast-local
          resources:
            requests:
              storage: 10Gi
    - name: docker-config
      secret:
        secretName: registry-push-bifrost-model-router
    # dockerconfigjson for ghcr.io (write:packages); only publish-ghcr binds it.
    - name: ghcr-docker-config
      secret:
        secretName: ghcr-push-credentials
